name: 오늘의 말씀 쇼츠

on:
  schedule:
    - cron: "40 20 * * *" # 매일 오전 5시 40분 (한국 시간)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "업로드 없이 영상만 만들어 보기"
        type: boolean
        default: false

permissions:
  contents: write # 올린 기록·통계를 저장소에 저장
  issues: write # 급한 댓글·문제를 이슈로 알림

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 한글 글꼴·ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 영상 만들고 업로드
        run: python -m shorts.daily ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 댓글 처리
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m shorts.comments

      - name: 통계 수집
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m shorts.analytics

      - name: 오늘 만든 영상 보관 (Actions 화면에서 내려받기 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: 기록 저장
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "daily-verse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "기록: $(TZ=Asia/Seoul date +%F) 오늘의 말씀"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
